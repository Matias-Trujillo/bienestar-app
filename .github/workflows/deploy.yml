name: CI/CD Pipeline — Bienestar App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Pruebas Automatizadas de Backend (Pytest + Invariantes)
  # -------------------------------------------------------------
  test-backend:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar suite de pruebas con Pytest
        working-directory: ./backend
        run: |
          pytest tests -v

  # -------------------------------------------------------------
  # Job 2: Verificación de Tipos Frontend (TypeScript Estricto)
  # -------------------------------------------------------------
  test-frontend:
    name: Frontend TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Validar tipos de TypeScript (0 errores)
        working-directory: ./frontend
        run: npx tsc --noEmit

  # -------------------------------------------------------------
  # Job 3: Despliegue Continuo en Servidor Secundario (Self-Hosted)
  # -------------------------------------------------------------
  deploy:
    name: Despliegue en Servidor Linux
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: self-hosted
    steps:
      - name: Actualizar repositorio y desplegar contenedores
        run: |
          cd /home/servidor/bienestar-app
          git pull origin ${{ github.ref_name }}
          docker compose -f docker-compose.prod.yml up -d --build
          docker image prune -f

