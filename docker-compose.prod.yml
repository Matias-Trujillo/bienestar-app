# ==============================================================================
# Orquestación de Producción — Bienestar App (Comité de Bienestar I.M. Peralillo)
# [ESTUDIANTE INFORMÁTICA] Este archivo levanta la pila completa para el servidor 24/7:
# PostgreSQL 15, FastAPI con 4 workers y Next.js Standalone, con política restart: always.
# ==============================================================================
services:
  # 1. Base de Datos Relacional PostgreSQL 15
  postgres:
    image: postgres:15-alpine
    container_name: bienestar_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bienestar_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PeralilloSeguro2026_Prod}
      POSTGRES_DB: ${POSTGRES_DB:-bienestar_db_prod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bienestar_admin} -d ${POSTGRES_DB:-bienestar_db_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bienestar_prod_network

  # 2. Backend API FastAPI (Python 3.11 asíncrono con 4 workers)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: bienestar_backend_prod
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bienestar_admin}:${POSTGRES_PASSWORD:-PeralilloSeguro2026_Prod}@postgres:5432/${POSTGRES_DB:-bienestar_db_prod}
      SECRET_KEY: ${SECRET_KEY:-c9f18a45b73d2e1f6a09c84e27bb140f7d56e3a981c2f40b82e1d75a6c3f09ab}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # HU-01: en servidor de pruebas se permite postular fuera del período ene-jun
      AFILIACION_VALIDAR_PERIODO: ${AFILIACION_VALIDAR_PERIODO:-false}
      AFILIACION_PORCENTAJE_DESCUENTO: 4
      AFILIACION_MESES_CARENCIA: 6
      # Servicio de Correo SMTP Saliente Institucional (bperalillo@gmail.com)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-bperalillo@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-xgsnewzymyqjumgc}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-bperalillo@gmail.com}
      SMTP_FROM_NAME: "Comité de Bienestar • I. Municipalidad de Peralillo"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_prod_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bienestar_prod_network

  # 3. Frontend Next.js (App Router con Standalone Output)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api/backend
    container_name: bienestar_frontend_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - bienestar_prod_network

  # 4. Suite Gráfica Oficial de PostgreSQL (pgAdmin 4 — Red Local / VPN Tailscale)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bienestar_pgadmin_prod
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-superadmin@mperalillo.cl}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Super#2026}
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "8080:80"
    volumes:
      - ./deploy/pgadmin_servers.json:/pgadmin4/servers.json:ro
      - pgadmin_v2_prod_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bienestar_prod_network

volumes:
  postgres_prod_data:
    driver: local
  backend_prod_uploads:
    driver: local
  pgadmin_v2_prod_data:
    driver: local

networks:
  bienestar_prod_network:
    driver: bridge
